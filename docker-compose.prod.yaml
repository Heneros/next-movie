services: 
  api: 
   build: 
    context: .
    dockerfile: ./docker/api/Dockerfile
    target: development
   restart: always
   ports:
   - "3001:3001"
   env_file:
    - .env
   volumes:
  #  - .:/usr/src/app
   - ./api:/usr/src/app/api:delegated
   - /usr/src/app/node_modules
   depends_on:
    - postgres
    - pgadmin
    - maildev
    - redis
   networks:
        movie_net:

    
    
    
  postgres:
    restart: always
    image: postgres:14-alpine
    env_file: .env
    # build:
    #  context: ./docker/postgres
    #  dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
      POSTGRES_DB:  ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      movie_net:


  pgadmin:
   image: dpage/pgadmin4:8
   restart: always
   environment: 
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
   ports: 
     - "5050:80"
   volumes:
      - pgadmin-data:/var/lib/pgadmin
   networks:
    movie_net:
     
  maildev:
   image: maildev/maildev:2.2.1
   restart: always
   ports:
    - "1080:1080"
    - "1025:1025"
   environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
   networks:
    movie_net:

  redis:
   image: redis:7.4
   restart: always
   ports:
    - '6379:6379'
   volumes:
   - redis_data:/data
   healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 5s
    retries: 5
   networks:
    movie_net:
    

    
volumes:
  postgres_data:
  redis_data:
  pgadmin-data:
  mongodb_master_data:


networks:
   movie_net:
      driver: bridge

